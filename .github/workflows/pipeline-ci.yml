name: Pipeline CI

on:
  push:
    branches: [main, "hardening/**", "release/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-validation:
    name: ETL and Power BI project validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile pipeline and tests
        run: python -m compileall -q notebooks tests
      - name: Run ETL and PBIP/PBIR regression tests
        run: python -m unittest discover -s tests -v
